name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  check-macos:
    name: Verify (macOS)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Run unit tests
        run: bun test

      - name: Run core smoke test
        run: bun run core:smoke

      - name: Run loopback smoke test
        run: bun run core:loopback-smoke

      - name: Build web frontend
        run: bun run web:build

      - name: Run Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked

  check-windows:
    name: Verify (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Run cross-platform unit tests
        run: >-
          bun test
          packages/core/src/validation.test.ts
          packages/core/src/history-migrations.test.ts
          packages/core/src/ollama.test.ts
          packages/core/src/local-runtimes.test.ts
          packages/core/src/cli-models.test.ts
          apps/web/src/runStreams.test.ts
          apps/web/src/workbenchStore.test.ts

      - name: Build web frontend
        run: bun run web:build

      - name: Build Windows sidecar binary
        run: bun --no-env-file run apps/desktop/scripts/build-core.ts

      - name: Run Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked
