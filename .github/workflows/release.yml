name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (defaults to the selected ref)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  verify:
    name: Verify before release
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify release version
        if: github.ref_type == 'tag' || inputs.tag != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node <<'NODE'
          const { version } = require('./package.json');
          const desktop = require('./apps/desktop/package.json');
          const tauri = require('./apps/desktop/src-tauri/tauri.conf.json');
          const tag = process.env.RELEASE_TAG;
          if (tag !== `v${version}` || desktop.version !== version || tauri.version !== version) {
            throw new Error(`Version mismatch: tag=${tag}, workspace=${version}, desktop=${desktop.version}, Tauri=${tauri.version}`);
          }
          NODE

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Run TypeScript, unit, smoke, and web build checks
        run: bun run check

      - name: Run Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked

  build-macos:
    name: Build macOS (${{ matrix.label }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
            macho_arch: arm64
            runner: macos-15
            label: Apple Silicon
          - target: x86_64-apple-darwin
            arch: x64
            macho_arch: x86_64
            runner: macos-15-intel
            label: Intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"
          key: release-${{ matrix.target }}

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build Uya desktop bundle (.app & .dmg)
        shell: bash
        env:
          CI: "true"
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.target }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # GitHub sets missing secrets to empty strings, which Tauri treats as supplied.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then unset "$name"; fi
          done
          if [[ -z "${APPLE_CERTIFICATE:-}" && -z "${APPLE_SIGNING_IDENTITY:-}" ]]; then
            export APPLE_SIGNING_IDENTITY=-
          fi
          bun run --cwd apps/desktop tauri build --config src-tauri/tauri.bundle.conf.json --target ${{ matrix.target }} --bundles app,dmg

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          BUNDLE_DIR="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          OUT_DIR="dist-release-${{ matrix.arch }}"
          mkdir -p "$OUT_DIR"

          DMG_FILE=$(find "$BUNDLE_DIR/dmg" -maxdepth 1 -name '*.dmg' | head -n 1)
          if [ -z "$DMG_FILE" ]; then
            echo "No .dmg bundle found in $BUNDLE_DIR/dmg" >&2
            exit 1
          fi
          cp "$DMG_FILE" "$OUT_DIR/Uya-${VERSION}-macos-${{ matrix.arch }}.dmg"

          APP_DIR="$BUNDLE_DIR/macos/Uya.app"
          if [ ! -d "$APP_DIR" ]; then
            echo "No Uya.app bundle found in $BUNDLE_DIR/macos" >&2
            exit 1
          fi
          codesign --verify --deep --strict "$APP_DIR"
          lipo "$APP_DIR/Contents/MacOS/uya" -verify_arch "${{ matrix.macho_arch }}"
          lipo "$APP_DIR/Contents/MacOS/uya-core" -verify_arch "${{ matrix.macho_arch }}"
          hdiutil verify "$DMG_FILE"
          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" "$OUT_DIR/Uya-${VERSION}-macos-${{ matrix.arch }}.app.zip"
          ls -lh "$OUT_DIR"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uya-macos-${{ matrix.arch }}
          path: dist-release-${{ matrix.arch }}/*
          if-no-files-found: error

  build-windows:
    name: Build Windows (x64)
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"
          key: release-x86_64-pc-windows-msvc

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Run Windows Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked

      - name: Build Uya Windows installers (.exe & .msi)
        env:
          CI: "true"
          TAURI_ENV_TARGET_TRIPLE: x86_64-pc-windows-msvc
        run: bun run --cwd apps/desktop tauri build --config src-tauri/tauri.bundle.conf.json --bundles nsis,msi

      - name: Collect release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = node -p "require('./package.json').version"
          $bundleDir = "apps/desktop/src-tauri/target/release/bundle"
          $outDir = "dist-release-win-x64"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          $nsis = Get-ChildItem "$bundleDir/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $nsis) { throw "No NSIS .exe installer found in $bundleDir/nsis" }
          Copy-Item $nsis.FullName "$outDir/Uya-$version-windows-x64-setup.exe"

          $msi = Get-ChildItem "$bundleDir/msi" -Filter "*.msi" | Select-Object -First 1
          if (-not $msi) { throw "No MSI installer found in $bundleDir/msi" }
          Copy-Item $msi.FullName "$outDir/Uya-$version-windows-x64.msi"

          Get-ChildItem $outDir

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uya-windows-x64
          path: dist-release-win-x64/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify release assets and generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          cd release-assets
          files=(
            "Uya-${VERSION}-macos-arm64.dmg"
            "Uya-${VERSION}-macos-arm64.app.zip"
            "Uya-${VERSION}-macos-x64.dmg"
            "Uya-${VERSION}-macos-x64.app.zip"
            "Uya-${VERSION}-windows-x64-setup.exe"
            "Uya-${VERSION}-windows-x64.msi"
          )
          for file in "${files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "Missing or empty release asset: $file" >&2
              exit 1
            fi
          done
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Build release notes
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          {
            echo "## Uya ${TAG}"
            echo ""
            if [ -f CHANGELOG.md ]; then
              awk -v ver="$VERSION" '
                $0 ~ "^## \\[" ver "\\]" { found=1; next }
                found && /^## \[/ { exit }
                found { print }
              ' CHANGELOG.md
            fi
            echo ""
            echo "### Downloads"
            echo ""
            echo "#### macOS (13+)"
            echo "- **Apple Silicon (M1 / M2 / M3 / M4):** \`Uya-${VERSION}-macos-arm64.dmg\` (or \`.app.zip\`)"
            echo "- **Intel Mac:** \`Uya-${VERSION}-macos-x64.dmg\` (or \`.app.zip\`)"
            echo ""
            echo "#### Windows (10 / 11, 64-bit)"
            echo "- **Installer (Recommended):** \`Uya-${VERSION}-windows-x64-setup.exe\` (no admin rights required)"
            echo "- **MSI Package:** \`Uya-${VERSION}-windows-x64.msi\`"
            echo ""
            echo "- **Checksums:** \`SHA256SUMS.txt\`"
            echo ""
            echo "### First Launch"
            echo ""
            echo "- **macOS:** If Gatekeeper blocks the app, follow [Apple's Open Anyway instructions](https://support.apple.com/en-us/102445)."
            echo "- **Windows:** The installers are unsigned. If SmartScreen displays *Windows protected your PC*, check the download against \`SHA256SUMS.txt\` before selecting **More info → Run anyway**."
          } > release-notes.md
          cat release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" release-assets/* \
            --verify-tag \
            --title "Uya ${TAG}" \
            --notes-file release-notes.md
