[package]
name = "uya"
version = "0.5.0"
description = "Uya — local-first multi-agent AI workbench for macOS and Windows"
homepage = "https://github.com/akenoowww/uya"
repository = "https://github.com/akenoowww/uya"
license = "Apache-2.0"
edition = "2021"
publish = false

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
getrandom = "0.4"
notify = "8"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tauri-plugin-updater = "2.14.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
