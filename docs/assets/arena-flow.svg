<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" width="1120" height="300" role="img" aria-label="Worktree Agent Arena workflow from prompt broadcast to verified winner apply">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1.5L8.5 5L0 8.5z" fill="#7d8294" />
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1120" height="300" rx="14" fill="#131418" stroke="#2f323d" />
  <text x="28" y="34" class="sans" font-size="13" font-weight="700" fill="#eceef4">Worktree Agent Arena — Isolated Parallel Coding &amp; Verification</text>
  <text x="1092" y="34" text-anchor="end" class="mono" font-size="11" fill="#7dd1a4">Zero merge conflicts · Atomic rollback</text>
  <line x1="28" y1="48" x2="1092" y2="48" stroke="#272933" />

  <!-- Step 1: Broadcast -->
  <rect x="28" y="88" width="176" height="148" rx="10" fill="#191a20" stroke="#b4a2ff" stroke-opacity="0.5" />
  <rect x="42" y="102" width="24" height="20" rx="5" fill="#2c2644" />
  <text x="54" y="116" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#b4a2ff">1</text>
  <text x="74" y="116" class="sans" font-size="12.5" font-weight="700" fill="#eceef4">Broadcast</text>
  <text x="42" y="144" class="sans" font-size="11.5" fill="#9ea2b2">Send one task prompt</text>
  <text x="42" y="162" class="sans" font-size="11.5" fill="#9ea2b2">with @context &amp; rules</text>
  <text x="42" y="180" class="sans" font-size="11.5" fill="#9ea2b2">to 2+ agent splits.</text>
  <rect x="42" y="198" width="146" height="24" rx="5" fill="#1b2f28" />
  <text x="115" y="214" text-anchor="middle" class="mono" font-size="10.5" fill="#7dd1a4">Worktree Arena: ON</text>

  <!-- Arrows 1 -> 2 -->
  <line x1="204" y1="138" x2="244" y2="112" stroke="#7d8294" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="204" y1="186" x2="244" y2="212" stroke="#7d8294" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Step 2: Parallel Git Worktrees -->
  <rect x="250" y="68" width="230" height="90" rx="10" fill="#191a20" stroke="#2f323d" />
  <text x="266" y="90" class="sans" font-size="12" font-weight="700" fill="#eceef4">Slot A · Codex</text>
  <text x="466" y="90" text-anchor="end" class="mono" font-size="10" fill="#b4a2ff">Agent</text>
  <text x="266" y="110" class="mono" font-size="10.5" fill="#9ea2b2">git worktree (detached HEAD)</text>
  <text x="266" y="128" class="sans" font-size="11" fill="#7d8294">Seeded with local WIP changes</text>
  <text x="266" y="146" class="mono" font-size="10.5" fill="#7dd1a4">+84 / -12 across 3 files</text>

  <rect x="250" y="170" width="230" height="90" rx="10" fill="#191a20" stroke="#2f323d" />
  <text x="266" y="192" class="sans" font-size="12" font-weight="700" fill="#eceef4">Slot B · Claude / Agy</text>
  <text x="466" y="192" text-anchor="end" class="mono" font-size="10" fill="#b4a2ff">Agent</text>
  <text x="266" y="212" class="mono" font-size="10.5" fill="#9ea2b2">git worktree (detached HEAD)</text>
  <text x="266" y="230" class="sans" font-size="11" fill="#7d8294">Protected paths never copied</text>
  <text x="266" y="248" class="mono" font-size="10.5" fill="#7dd1a4">+41 / -9 across 2 files</text>

  <!-- Arrows 2 -> 3 -->
  <line x1="480" y1="112" x2="520" y2="112" stroke="#7d8294" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="480" y1="214" x2="520" y2="214" stroke="#7d8294" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Step 3: Verify & Cross-Review -->
  <rect x="526" y="68" width="256" height="192" rx="10" fill="#191a20" stroke="#2f323d" />
  <rect x="542" y="82" width="24" height="20" rx="5" fill="#2c2644" />
  <text x="554" y="96" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#b4a2ff">3</text>
  <text x="574" y="96" class="sans" font-size="12.5" font-weight="700" fill="#eceef4">Verify &amp; Cross-Review</text>

  <rect x="542" y="112" width="224" height="40" rx="6" fill="#14151a" stroke="#7dd1a4" stroke-opacity="0.35" />
  <text x="554" y="130" class="mono" font-size="10.5" fill="#7dd1a4">✓ bun test · typecheck</text>
  <text x="554" y="145" class="sans" font-size="10.5" fill="#9ea2b2">Runs inside each worktree</text>

  <rect x="542" y="160" width="224" height="40" rx="6" fill="#14151a" stroke="#2f323d" />
  <text x="554" y="178" class="sans" font-size="11" font-weight="600" fill="#eceef4">Monaco Side-by-Side Diff</text>
  <text x="554" y="193" class="sans" font-size="10.5" fill="#9ea2b2">Inspect every file per slot</text>

  <rect x="542" y="208" width="224" height="40" rx="6" fill="#14151a" stroke="#b4a2ff" stroke-opacity="0.38" />
  <text x="554" y="226" class="sans" font-size="11" font-weight="600" fill="#b4a2ff">⚖ Patch-Aware Judge</text>
  <text x="554" y="241" class="sans" font-size="10.5" fill="#9ea2b2">Reviews real Git diffs + test logs</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="782" y1="164" x2="824" y2="164" stroke="#7d8294" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Step 4: Atomic Winner Apply -->
  <rect x="830" y="78" width="262" height="172" rx="10" fill="#18221e" stroke="#7dd1a4" stroke-opacity="0.55" />
  <rect x="846" y="94" width="24" height="20" rx="5" fill="#1b3a2e" />
  <text x="858" y="108" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#7dd1a4">4</text>
  <text x="878" y="108" class="sans" font-size="12.5" font-weight="700" fill="#eceef4">Apply Winner</text>

  <rect x="846" y="126" width="230" height="48" rx="6" fill="#131a17" stroke="#7dd1a4" stroke-opacity="0.35" />
  <text x="858" y="145" class="sans" font-size="11.5" font-weight="650" fill="#7dd1a4">Apply to Workspace</text>
  <text x="858" y="162" class="sans" font-size="10.5" fill="#9ea2b2">Auto checkpoint + atomic rollback</text>

  <rect x="846" y="184" width="230" height="48" rx="6" fill="#14151a" stroke="#2f323d" />
  <text x="858" y="203" class="sans" font-size="11.5" font-weight="650" fill="#eceef4">Save as New Git Branch</text>
  <text x="858" y="220" class="sans" font-size="10.5" fill="#9ea2b2">Clean commit via temp index</text>

  <!-- Bottom note -->
  <text x="28" y="284" class="sans" font-size="11" fill="#7d8294">Worktrees live privately under <tspan class="mono" fill="#9ea2b2">&lt;dataDir&gt;/worktrees/</tspan> and are pruned automatically on apply, discard, or startup GC.</text>
</svg>
